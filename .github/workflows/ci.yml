name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Format, lint, and smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Electron's postinstall downloads a ~100MB binary that CI never launches;
      # the checks here are static analysis and source parsing only.
      - name: Install dependencies
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Smoke test
        run: npm test
